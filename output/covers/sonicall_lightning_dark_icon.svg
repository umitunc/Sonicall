<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Mode Deep Obsidian / Carbon Background -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B1B22"/>
      <stop offset="100%" stop-color="#0E0E12"/>
    </linearGradient>

    <!-- Neon Rim Glow Gradient -->
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="60%" stop-color="#EE0979"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>

    <!-- Glowing Lightning Bolt Gradient -->
    <linearGradient id="electricBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E00"/>
      <stop offset="45%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#EE0979"/>
    </linearGradient>

    <!-- Headphone Titanium Gradient -->
    <linearGradient id="titanium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B0B0C0"/>
    </linearGradient>

    <!-- Ambient Neon Backlight Glow -->
    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5E3A" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#EE0979" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="darkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Apple HIG Squircle Base (Curvature rx=115 for 512px) -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#darkBg)"/>

  <!-- Center Ambient Radial Pulse -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#centerAura)"/>

  <!-- Neon Border Glow (Apple Pro Edge) -->
  <rect x="2.5" y="2.5" width="507" height="507" rx="113" ry="113" fill="none" stroke="url(#neonRim)" stroke-width="4.5" opacity="0.9"/>

  <!-- Sound Waves (Neon Pink/Orange) -->
  <g fill="url(#electricBolt)" filter="url(#neonGlow)" opacity="0.9">
    <!-- Left Soundwaves -->
    <rect x="74" y="246" width="7" height="20" rx="3.5"/>
    <rect x="91" y="232" width="7" height="48" rx="3.5"/>
    <rect x="108" y="218" width="7" height="76" rx="3.5"/>
    <rect x="125" y="236" width="7" height="40" rx="3.5"/>

    <!-- Right Soundwaves -->
    <rect x="380" y="236" width="7" height="40" rx="3.5"/>
    <rect x="397" y="218" width="7" height="76" rx="3.5"/>
    <rect x="414" y="232" width="7" height="48" rx="3.5"/>
    <rect x="431" y="246" width="7" height="20" rx="3.5"/>
  </g>

  <!-- Central Audio Lightning Motif -->
  <g filter="url(#darkShadow)">
    <!-- Headphone Arch (Sleek Matte Silver/Titanium with subtle glow) -->
    <path d="M 172 260 C 172 150, 340 150, 340 260" 
          fill="none" 
          stroke="url(#titanium)" 
          stroke-width="18" 
          stroke-linecap="round"/>

    <!-- Left Ear Cup -->
    <rect x="150" y="236" width="30" height="72" rx="15" fill="url(#titanium)"/>
    <rect x="174" y="244" width="7" height="56" rx="3.5" fill="#FF6A00"/>

    <!-- Right Ear Cup -->
    <rect x="332" y="236" width="30" height="72" rx="15" fill="url(#titanium)"/>
    <rect x="331" y="244" width="7" height="56" rx="3.5" fill="#EE0979"/>

    <!-- Dynamic Neon Lightning Bolt -->
    <path d="M 276 138 
             L 208 266 
             C 205 272, 210 278, 217 278 
             L 254 278 
             L 230 380 
             C 227 390, 239 396, 245 388 
             L 316 260 
             C 319 254, 315 248, 307 248 
             L 272 248 
             L 290 144 
             C 292 135, 281 129, 276 138 Z" 
          fill="url(#electricBolt)" 
          filter="url(#neonGlow)"/>

    <!-- Inner Core Brightness -->
    <path d="M 273 154 L 216 264 L 253 264 L 236 358 L 302 254 L 268 254 Z" 
          fill="#FFFDF0" 
          opacity="0.85"/>
  </g>
</svg>